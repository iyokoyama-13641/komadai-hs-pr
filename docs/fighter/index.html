<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>柔道ファイター</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
  canvas{width:100%;display:block;background:#000;aspect-ratio:16/9}
  #help{font-size:12px;padding:6px 10px;color:#aaa;line-height:1.6}
  #pad{display:none;justify-content:space-between;padding:8px 10px 16px}
  #pad .grp{display:grid;gap:8px}
  #dpad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px)}
  #acts{grid-template-columns:repeat(2,84px);grid-template-rows:repeat(2,64px)}
  #pad button{border:2px solid #666;background:#2a2a2a;color:#fff;border-radius:12px;font-size:18px;font-weight:bold;touch-action:none}
  #pad button.on{background:#c0392b}
  @media (pointer:coarse){#pad{display:flex}#help{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="help">
    <b>1P</b>: A/D=移動 W=ジャンプ S=しゃがみ（後ろ入力でガード）J=パンチ K=キック L=<b>投げ</b>（近づいて）I=必殺技（↓→+Jでも出ます）<br>
    <b>2P</b>: ←/→=移動 ↑=ジャンプ ↓=しゃがみ ,=パンチ .=キック /=投げ ;=必殺技　／　CPU戦では矢印キー+Z/X/C/Vでも操作可　／　P=ポーズ
  </div>
  <div id="pad">
    <div class="grp" id="dpad">
      <span></span><button data-k="up">▲</button><span></span>
      <button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button>
    </div>
    <div class="grp" id="acts">
      <button data-k="punch">パンチ</button><button data-k="kick">キック</button>
      <button data-k="throw">投げ</button><button data-k="special">必殺</button>
    </div>
  </div>
</div>

<script>
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 460, WALL = 40;
const FONT = '"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif';

/* ---------- 音 ---------- */
let ac = null;
function snd(freq, dur, type = 'square', vol = 0.07, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const SFX = {
  swing: () => snd(500, 0.08, 'triangle', 0.04, -300),
  hit:   () => snd(220, 0.12, 'sawtooth', 0.09, -150),
  big:   () => { snd(120, 0.25, 'sawtooth', 0.12, -80); snd(300, 0.1, 'square', 0.06, -200); },
  block: () => snd(700, 0.05, 'square', 0.04, -200),
  fire:  () => snd(300, 0.3, 'sawtooth', 0.05, 500),
  throw: () => { snd(180, 0.3, 'square', 0.08, -120); },
  ko:    () => snd(160, 0.8, 'sawtooth', 0.12, -140),
  ui:    () => snd(660, 0.06, 'square', 0.05),
  fight: () => { snd(440, 0.1); setTimeout(() => snd(660, 0.18), 100); },
};

/* ---------- 技データ（フレームは60fps） ---------- */
// su=発生 ac=持続 rec=硬直 / 判定は足元基準・前方への距離(rx0..rx1)と高さ(y0..y1)
const ATK = {
  punch:  { su: 4, ac: 4, rec: 9,  dmg: 6,  rx0: 15, rx1: 75,  y0: -125, y1: -88, type: 'mid',  stun: 15, push: 4 },
  kick:   { su: 8, ac: 5, rec: 15, dmg: 11, rx0: 15, rx1: 100, y0: -112, y1: -58, type: 'mid',  stun: 19, push: 8 },
  cpunch: { su: 4, ac: 4, rec: 8,  dmg: 5,  rx0: 15, rx1: 75,  y0: -80,  y1: -45, type: 'mid',  stun: 14, push: 3 },
  sweep:  { su: 7, ac: 4, rec: 19, dmg: 9,  rx0: 15, rx1: 105, y0: -28,  y1: 0,   type: 'low',  stun: 20, push: 5, knockdown: true },
  jpunch: { su: 3, ac: 0, rec: 0,  dmg: 7,  rx0: 10, rx1: 70,  y0: -105, y1: -50, type: 'high', stun: 16, push: 4, air: true },
  jkick:  { su: 3, ac: 0, rec: 0,  dmg: 10, rx0: 10, rx1: 85,  y0: -80,  y1: -20, type: 'high', stun: 18, push: 6, air: true },
  throw:  { su: 5, ac: 1, rec: 30, kind: 'throw', dmg: 18 },
  fire:   { su: 14, ac: 1, rec: 26, kind: 'fire' },
};
const FIRE = { dmg: 12, stun: 20, push: 7, chip: 2, type: 'mid', speed: 6.5 };

/* ---------- キャラクター ---------- */
const CHARS = [
  { name: '柔', gi: '#f4f4f0', shade: '#cfcfc6', belt: '#222', skin: '#e8b48a', hair: '#1a1a1a', band: null },
  { name: '黒帯', gi: '#2f5fa8', shade: '#244a84', belt: '#e8c23a', skin: '#d9a073', hair: '#2a1a10', band: '#e8c23a' },
];

class Fighter {
  constructor(idx) { this.idx = idx; this.ch = CHARS[idx]; this.wins = 0; this.inp = { held: {}, press: {} }; this.cmd = []; }
  reset() {
    this.x = this.idx === 0 ? 300 : 660; this.y = 0; this.vx = 0; this.vy = 0;
    this.facing = this.idx === 0 ? 1 : -1;
    this.hp = 100; this.state = 'idle'; this.t = 0; this.stun = 0; this.atk = null; this.hitDone = false;
    this.crouch = false; this.lying = false; this.wt = 0; this.cmd = []; this.cmdLast = ''; this.cmdFrame = 0;
  }
  get air() { return this.y < 0; }
  get actionable() { return this.state === 'idle'; }
  hurt() { // 当たり判定（足元基準の矩形）
    const h = this.crouch && !this.air ? 72 : 125;
    return { x0: this.x - 24, x1: this.x + 24, y0: this.y - h, y1: this.y };
  }
}

/* ---------- ゲーム状態 ---------- */
let scene = 'title', mode = 'cpu', level = 1, menuSel = 0;
const players = [new Fighter(0), new Fighter(1)];
let projs = [], fx = [], frame = 0, hitstop = 0, shake = 0, paused = false;
let round = 1, timeLeft = 99, timeTick = 0, phaseT = 0, banner = '', winnerMsg = '';
const LEVELS = [
  { label: 'かんたん', think: [18, 32], def: 0.25, agg: 0.55 },
  { label: 'ふつう',   think: [10, 20], def: 0.5,  agg: 0.8 },
  { label: 'つよい',   think: [5, 11],  def: 0.78, agg: 1.0 },
];
const ai = { t: 0 };

function startMatch() {
  players.forEach(p => p.wins = 0);
  round = 1; startRound();
}
function startRound() {
  players.forEach(p => p.reset());
  projs = []; fx = []; timeLeft = 99; timeTick = 0; hitstop = 0; shake = 0;
  scene = 'intro'; phaseT = 0; ai.t = 20;
  banner = 'ROUND ' + round;
}

/* ---------- 入力 ---------- */
const K1 = { KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down', KeyJ: 'punch', KeyK: 'kick', KeyL: 'throw', KeyI: 'special' };
const K2 = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', Comma: 'punch', Period: 'kick', Slash: 'throw', Semicolon: 'special' };
const K1X = { KeyZ: 'punch', KeyX: 'kick', KeyC: 'throw', KeyV: 'special' };

function setAct(p, act, down) {
  const inp = players[p].inp;
  if (down && !inp.held[act]) inp.press[act] = true;
  inp.held[act] = down;
}
function keyTarget(code) {
  if (code in K1) return [0, K1[code]];
  if (code in K2) return mode === 'cpu' ? [0, K2[code]] : [1, K2[code]];
  if (code in K1X) return [0, K1X[code]];
  return null;
}
addEventListener('keydown', e => {
  const code = e.code;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Slash'].includes(code)) e.preventDefault();
  if (e.repeat) return;
  if (scene === 'title') { menuKey(code); return; }
  if (scene === 'matchEnd') { if (['Enter', 'Space', 'KeyJ'].includes(code)) { SFX.ui(); startMatch(); } else if (code === 'Escape' || code === 'KeyT') { scene = 'title'; } return; }
  if (code === 'KeyP' || code === 'Escape') { paused = !paused; return; }
  const t = keyTarget(code); if (t) setAct(t[0], t[1], true);
});
addEventListener('keyup', e => { const t = keyTarget(e.code); if (t) setAct(t[0], t[1], false); });
addEventListener('blur', () => players.forEach(p => { p.inp.held = {}; }));

// タッチ操作
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); if (scene === 'title') { return; } setAct(0, k, true); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); setAct(0, k, false); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

// メニュー
const MENU = () => [
  { text: 'ひとりで対戦（CPU）', act: () => { mode = 'cpu'; startMatch(); } },
  { text: 'ふたりで対戦', act: () => { mode = '2p'; startMatch(); } },
  { text: 'CPUの強さ： ' + LEVELS[level].label + '　◀▶', act: () => { level = (level + 1) % 3; } },
];
function menuKey(code) {
  const m = MENU();
  if (['ArrowUp', 'KeyW'].includes(code)) { menuSel = (menuSel + m.length - 1) % m.length; SFX.ui(); }
  else if (['ArrowDown', 'KeyS'].includes(code)) { menuSel = (menuSel + 1) % m.length; SFX.ui(); }
  else if (['ArrowLeft', 'KeyA'].includes(code) && menuSel === 2) { level = (level + 2) % 3; SFX.ui(); }
  else if (['ArrowRight', 'KeyD'].includes(code) && menuSel === 2) { level = (level + 1) % 3; SFX.ui(); }
  else if (['Enter', 'Space', 'KeyJ'].includes(code)) { SFX.ui(); m[menuSel].act(); }
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (scene === 'title') {
    MENU().forEach((it, i) => { const by = 270 + i * 70; if (x > 280 && x < 680 && y > by && y < by + 56) { menuSel = i; SFX.ui(); it.act(); } });
  } else if (scene === 'matchEnd') { SFX.ui(); startMatch(); }
});

/* ---------- コマンド入力（↓→ + パンチ） ---------- */
function trackCmd(f) {
  const h = f.inp.held, fw = f.facing === 1 ? 'right' : 'left';
  let tok = '';
  if (h.down) tok = h[fw] ? 'DF' : 'D'; else if (h[fw]) tok = 'F';
  if (tok !== f.cmdLast) { f.cmd.push({ tok, fr: frame }); f.cmdLast = tok; if (f.cmd.length > 6) f.cmd.shift(); }
}
function fireCommand(f) {
  const c = f.cmd.filter(e => frame - e.fr < 28);
  const iD = c.findIndex(e => e.tok === 'D' || e.tok === 'DF');
  if (iD < 0) return false;
  return c.slice(iD + 1).some(e => e.tok === 'DF' || e.tok === 'F');
}

/* ---------- 攻撃・被弾 ---------- */
function startAttack(f, name) {
  f.state = 'attack'; f.atk = name; f.t = 0; f.hitDone = false;
  if (!ATK[name].air) f.vx = 0;
  SFX.swing();
}
function overlap(a, b) { return a.x0 < b.x1 && a.x1 > b.x0 && a.y0 < b.y1 && a.y1 > b.y0; }
function backHeld(d) { return d.inp.held[d.facing === 1 ? 'left' : 'right']; }

// a が d に攻撃 spec を当てる。戻り値: 'hit' | 'block' | null
function resolveHit(a, d, spec, dir) {
  if (d.state === 'down' || d.hp <= 0) return null;
  const blocked = !d.air && (d.state === 'idle' || d.state === 'block') && backHeld(d) &&
    !(spec.type === 'low' && !d.crouch) && !(spec.type === 'high' && d.crouch);
  const cx = (a.x + d.x) / 2, cy = d.y - (d.crouch ? 45 : 90);
  if (blocked) {
    d.state = 'block'; d.t = 0; d.stun = Math.max(8, spec.stun - 5); d.vx = dir * spec.push * 0.8;
    if (spec.chip) d.hp = Math.max(1, d.hp - spec.chip);
    fx.push({ x: d.x + d.facing * 24, y: d.y - 90, t: 0, kind: 'block' });
    SFX.block(); hitstop = 3;
    if (!spec.proj) a.vx = -dir * spec.push * 0.6;
    return 'block';
  }
  d.hp = Math.max(0, d.hp - spec.dmg);
  const down = spec.knockdown || d.air || d.hp <= 0;
  if (down) {
    d.state = 'down'; d.lying = false; d.t = 0; d.vy = -8.5; d.vx = dir * 5; d.y = Math.min(d.y, -0.01);
  } else {
    d.state = 'hit'; d.t = 0; d.stun = spec.stun; d.vx = dir * spec.push; d.crouch = false;
  }
  fx.push({ x: cx, y: cy, t: 0, kind: spec.dmg >= 10 ? 'big' : 'hit' });
  (spec.dmg >= 10 ? SFX.big : SFX.hit)();
  hitstop = spec.dmg >= 10 ? 7 : 5; shake = spec.dmg >= 10 ? 8 : 4;
  return 'hit';
}

/* ---------- ファイター更新 ---------- */
function updateFighter(f, o, enabled) {
  const inp = f.inp, h = inp.held, p = inp.press;
  if (!enabled) { inp.held = {}; inp.press = {}; }
  trackCmd(f);

  // 向き
  if (!f.air && (f.state === 'idle') ) f.facing = o.x >= f.x ? 1 : -1;

  const A = f.atk ? ATK[f.atk] : null;

  if (f.state === 'idle') {
    f.crouch = !f.air && !!h.down;
    const dir = (h.right ? 1 : 0) - (h.left ? 1 : 0);
    if (!f.air) {
      f.vx = f.crouch ? 0 : dir * (dir === f.facing ? 3.5 : 2.7);
      if (f.vx) f.wt += 0.22;
      if (h.up && !f.crouch) { f.vy = -15.5; f.vx = dir * 4.2; f.y = -0.01; }
    }
    // 技
    const isFire = !f.air && p.punch && fireCommand(f);
    if (p.throw && !f.air) startAttack(f, 'throw');
    else if (p.special && !f.air || isFire) { if (!projs.some(q => q.owner === f)) startAttack(f, 'fire'); }
    else if (p.punch) startAttack(f, f.air ? 'jpunch' : f.crouch ? 'cpunch' : 'punch');
    else if (p.kick) startAttack(f, f.air ? 'jkick' : f.crouch ? 'sweep' : 'kick');
  } else if (f.state === 'attack') {
    f.t++;
    const active = A.air ? f.t > A.su : (f.t > A.su && f.t <= A.su + A.ac);
    if (A.kind === 'throw' && f.t === A.su + 1) {
      const d = Math.abs(o.x - f.x);
      if (d < 90 && !o.air && !['down', 'attack_'].includes(o.state) && o.hp > 0) {
        o.hp = Math.max(0, o.hp - A.dmg);
        o.state = 'down'; o.lying = false; o.t = 0; o.crouch = false;
        o.vy = -11; o.vx = f.facing * 4.5; o.y = -0.01; o.facing = -f.facing;
        o.x = f.x + f.facing * 40;
        fx.push({ x: o.x, y: -60 + GROUND * 0 - 20, t: 0, kind: 'big', ground: true });
        SFX.throw(); hitstop = 8; shake = 10; f.hitDone = true;
      }
    } else if (A.kind === 'fire' && f.t === A.su + 1) {
      projs.push({ x: f.x + f.facing * 50, y: -92, vx: f.facing * FIRE.speed, owner: f, t: 0 });
      SFX.fire();
    } else if (!A.kind && active && !f.hitDone) {
      const x0 = f.x + f.facing * A.rx0, x1 = f.x + f.facing * A.rx1;
      const box = { x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: f.y + A.y0, y1: f.y + A.y1 };
      if (overlap(box, o.hurt())) {
        if (resolveHit(f, o, A, f.facing)) f.hitDone = true;
      }
    }
    if (!A.air && f.t >= A.su + A.ac + A.rec) { f.state = 'idle'; f.atk = null; }
  } else if (f.state === 'hit' || f.state === 'block') {
    f.t++; f.vx *= 0.82;
    if (f.t >= f.stun) { f.state = 'idle'; f.vx = 0; }
  } else if (f.state === 'down') {
    f.t++;
    if (f.lying) {
      f.vx *= 0.8;
      if (f.hp > 0 && f.t > 55) { f.state = 'idle'; f.lying = false; f.vx = 0; }
    }
  }

  // 物理
  f.x += f.vx;
  if (f.y < 0 || f.vy < 0) {
    f.vy += 0.85; f.y += f.vy;
    if (f.y >= 0) {
      f.y = 0; f.vy = 0;
      if (f.state === 'attack' && A && A.air) { f.state = 'idle'; f.atk = null; f.vx = 0; }
      else if (f.state === 'idle') f.vx = 0;
      else if (f.state === 'down') { f.lying = true; f.t = 0; f.vx *= 0.4; shake = Math.max(shake, 5); }
    }
  }
}

function updateProjectiles() {
  for (const q of projs) {
    q.x += q.vx; q.t++;
    const o = players[1 - q.owner.idx];
    const box = { x0: q.x - 18, x1: q.x + 18, y0: q.y - 18, y1: q.y + 18 };
    if (overlap(box, o.hurt()) && o.state !== 'down') {
      resolveHit(q.owner, o, { ...FIRE, proj: true }, Math.sign(q.vx)); q.dead = true;
    }
    if (q.x < -40 || q.x > W + 40) q.dead = true;
    for (const r of projs) if (r !== q && r.owner !== q.owner && Math.abs(r.x - q.x) < 30) { q.dead = r.dead = true; fx.push({ x: q.x, y: GROUND + q.y, t: 0, kind: 'block', ground: true }); }
  }
  projs = projs.filter(q => !q.dead);
}

/* ---------- CPU ---------- */
function cpuThink(f, o) {
  const L = LEVELS[level];
  if (--ai.t > 0) return;
  ai.t = L.think[0] + Math.random() * (L.think[1] - L.think[0]);
  const inp = f.inp; inp.held = {};
  const d = Math.abs(o.x - f.x), fwd = o.x > f.x ? 'right' : 'left', back = fwd === 'right' ? 'left' : 'right';
  const r = Math.random();
  const incoming = projs.some(q => q.owner !== f && Math.abs(q.x - f.x) < 240 && Math.sign(q.vx) === Math.sign(f.x - q.x));
  const threat = (o.state === 'attack' && d < 150) || incoming;
  if (threat && Math.random() < L.def) {
    inp.held[back] = true;
    if (o.atk === 'sweep' || incoming || Math.random() < 0.35) inp.held.down = true;
    ai.t = 9; return;
  }
  if (f.state !== 'idle') return;
  if (d > 360) { if (r < 0.3 && !projs.some(q => q.owner === f)) inp.press.special = true; else inp.held[fwd] = true; }
  else if (d > 150) {
    if (r < 0.12 && !projs.some(q => q.owner === f)) inp.press.special = true;
    else if (r < 0.2) { inp.held.up = true; inp.held[fwd] = true; if (Math.random() < 0.5) setTimeout(() => { f.inp.press.kick = true; }, 380); }
    else inp.held[fwd] = true;
  } else {
    const a = L.agg;
    if (r < a * 0.32) inp.press.punch = true;
    else if (r < a * 0.55) inp.press.kick = true;
    else if (r < a * 0.68) inp.press.throw = true;
    else if (r < a * 0.78) { inp.held.down = true; inp.press.kick = true; }
    else if (r < 0.9) inp.held[back] = true;
  }
}

/* ---------- メイン更新 ---------- */
function update() {
  frame++;
  fx.forEach(e => e.t++); fx = fx.filter(e => e.t < 18);
  if (shake > 0) shake *= 0.8;

  if (scene === 'intro') {
    phaseT++;
    if (phaseT === 62) { banner = 'FIGHT!'; SFX.fight(); }
    if (phaseT > 105) { scene = 'fight'; banner = ''; }
    players.forEach(p => { p.inp.press = {}; });
    return;
  }
  if (scene !== 'fight' && scene !== 'roundEnd') return;

  if (hitstop > 0) { hitstop--; return; }

  const [p1, p2] = players;
  const live = scene === 'fight';
  if (mode === 'cpu' && live) cpuThink(p2, p1);
  updateFighter(p1, p2, live);
  updateFighter(p2, p1, live && mode !== 'cpu' ? true : live);
  updateProjectiles();

  // 押し合い・壁
  if (!p1.air && !p2.air && Math.abs(p1.x - p2.x) < 48) {
    const ov = 48 - Math.abs(p1.x - p2.x), s = p1.x <= p2.x ? 1 : -1;
    p1.x -= s * ov / 2; p2.x += s * ov / 2;
  }
  for (const p of players) p.x = Math.max(WALL, Math.min(W - WALL, p.x));
  if (!p1.air && !p2.air && Math.abs(p1.x - p2.x) < 48) { // 壁際で重ならない
    const s = p1.x <= p2.x ? 1 : -1;
    if (p1.x <= WALL || p1.x >= W - WALL) p2.x = p1.x + s * 48; else p1.x = p2.x - s * 48;
  }

  players.forEach(p => { p.inp.press = {}; });

  if (scene === 'fight') {
    if (++timeTick >= 60) { timeTick = 0; timeLeft--; }
    if (p1.hp <= 0 || p2.hp <= 0 || timeLeft <= 0) endRound();
  } else {
    phaseT++;
    if (phaseT > 170) nextRound();
  }
}
function endRound() {
  const [p1, p2] = players;
  scene = 'roundEnd'; phaseT = 0;
  let w = null;
  if (p1.hp > p2.hp) w = p1; else if (p2.hp > p1.hp) w = p2;
  banner = (p1.hp <= 0 || p2.hp <= 0) ? 'K.O.!' : 'TIME UP';
  if (w) { w.wins++; winnerMsg = (w.idx === 0 ? '1P' : (mode === 'cpu' ? 'CPU' : '2P')) + ' の勝ち！'; } else winnerMsg = 'ひきわけ';
  SFX.ko(); hitstop = 0;
}
function nextRound() {
  const [p1, p2] = players;
  if (p1.wins >= 2 || p2.wins >= 2) {
    scene = 'matchEnd';
    const w = p1.wins >= 2 ? '1P' : (mode === 'cpu' ? 'CPU' : '2P');
    banner = w + ' 勝利！';
    return;
  }
  round++; startRound();
}

/* ---------- 描画 ---------- */
function drawBG() {
  // 道場の壁
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#3a2a1c'); g.addColorStop(1, '#7a5836');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
  // 板壁
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, GROUND); ctx.stroke(); }
  // 窓
  for (let i = 0; i < 4; i++) {
    const wx = 90 + i * 220;
    ctx.fillStyle = '#bcd9e8'; ctx.fillRect(wx, 80, 120, 110);
    ctx.fillStyle = '#3a2a1c'; ctx.fillRect(wx + 58, 80, 4, 110); ctx.fillRect(wx, 132, 120, 4);
    ctx.strokeStyle = '#2a1c10'; ctx.lineWidth = 6; ctx.strokeRect(wx, 80, 120, 110);
  }
  // 掛け軸「柔」
  ctx.fillStyle = '#f2ead4'; ctx.fillRect(W / 2 - 38, 36, 76, 150);
  ctx.strokeStyle = '#5a1f1f'; ctx.lineWidth = 5; ctx.strokeRect(W / 2 - 38, 36, 76, 150);
  ctx.fillStyle = '#111'; ctx.font = `bold 64px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('柔', W / 2, 112);
  // 梁
  ctx.fillStyle = '#2a1c10'; ctx.fillRect(0, 0, W, 22);
  // 畳
  const tg = ctx.createLinearGradient(0, GROUND - 30, 0, H);
  tg.addColorStop(0, '#9fb36a'); tg.addColorStop(1, '#6d8244');
  ctx.fillStyle = tg; ctx.fillRect(0, GROUND - 30, W, H - GROUND + 30);
  ctx.strokeStyle = '#3f5226'; ctx.lineWidth = 3;
  for (let x = 0; x <= W; x += 160) { ctx.beginPath(); ctx.moveTo(x, GROUND - 30); ctx.lineTo(x - 60 + (x - W / 2) * 0.25, H); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(0, GROUND - 30); ctx.lineTo(W, GROUND - 30); ctx.stroke();
  ctx.fillStyle = '#2a1c10'; ctx.fillRect(0, GROUND - 34, W, 6);
}

function limb(a, b, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function getPose(f) {
  const idle = { hip: [0, -62], sh: [0, -110], head: [0, -132], hf: [34, -112], hb: [20, -98], ff: [24, 0], fb: [-20, 0] };
  const crouch = { hip: [0, -34], sh: [6, -72], head: [10, -93], hf: [36, -78], hb: [22, -66], ff: [32, 0], fb: [-24, 0] };
  const jump = { hip: [0, -62], sh: [0, -108], head: [0, -130], hf: [30, -112], hb: [16, -100], ff: [26, -34], fb: [-14, -24] };
  const A = f.atk ? ATK[f.atk] : null;
  let p;
  if (f.state === 'down') p = { hip: [0, -50], sh: [0, -100], head: [0, -122], hf: [18, -80], hb: [8, -70], ff: [20, -14], fb: [-16, -6] };
  else if (f.state === 'hit') p = { hip: [-6, -62], sh: [-16, -108], head: [-24, -128], hf: [10, -80], hb: [-4, -76], ff: [18, 0], fb: [-24, 0] };
  else if (f.state === 'block') p = f.crouch ? { ...crouch, hf: [30, -90], hb: [22, -86] } : { ...idle, hf: [30, -128], hb: [22, -118] };
  else if (f.state === 'attack') {
    let e = 1;
    const tot = A.su + A.ac + A.rec;
    if (A.air) e = f.t > A.su ? 1 : f.t / A.su * 0.5;
    else if (f.t <= A.su) e = f.t / A.su * 0.5;
    else if (f.t <= A.su + A.ac) e = 1;
    else e = Math.max(0, 0.6 * (1 - (f.t - A.su - A.ac) / A.rec));
    if (f.atk === 'punch') p = { ...idle, sh: [4, -110], hf: [30 + e * 52, -108] };
    else if (f.atk === 'kick') p = { ...idle, sh: [-6 * e, -110], head: [-6 * e, -132], hf: [14, -102], ff: [24 + e * 74, -16 - e * 62] };
    else if (f.atk === 'cpunch') p = { ...crouch, hf: [32 + e * 50, -70] };
    else if (f.atk === 'sweep') p = { ...crouch, ff: [30 + e * 76, -8], fb: [-26, 0] };
    else if (f.atk === 'jpunch') p = { ...jump, hf: [30 + e * 45, -96] };
    else if (f.atk === 'jkick') p = { ...jump, ff: [26 + e * 64, -50 + e * 8] };
    else if (f.atk === 'throw') p = { ...idle, sh: [6, -108], head: [10, -130], hf: [46, -98], hb: [42, -88], ff: [30, 0], fb: [-22, 0] };
    else if (f.atk === 'fire') {
      const x = 28 + (f.t > A.su ? 30 : e * 20);
      p = { ...crouch, sh: [6, -80], head: [10, -100], hf: [x + 4, -94], hb: [x - 4, -86] };
    }
  } else if (f.air) p = jump;
  else if (f.crouch) p = crouch;
  else {
    p = { ...idle };
    const bob = Math.sin(frame * 0.1) * 2;
    p.sh = [0, -110 + bob]; p.head = [0, -132 + bob]; p.hf = [34, -112 + bob];
    if (f.vx) {
      const s = Math.sin(f.wt) * 14;
      p.ff = [24 + s, Math.min(0, -Math.cos(f.wt) * 8)]; p.fb = [-20 - s, Math.min(0, Math.cos(f.wt) * 8)];
    }
  }
  return p;
}
function drawFighter(f) {
  const c = f.ch, p = getPose(f);
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  const sh = Math.max(0.4, 1 + f.y / 260);
  ctx.beginPath(); ctx.ellipse(f.x, GROUND, 38 * sh, 9 * sh, 0, 0, 7); ctx.fill();

  ctx.save();
  ctx.translate(f.x, GROUND + f.y); ctx.scale(f.facing, 1);
  if (f.state === 'down') { ctx.translate(0, -18); ctx.rotate(-Math.PI / 2 * Math.min(1, (f.lying ? 1 : 0.4 + f.t * 0.1))); }
  // 奥の手足
  limb(p.sh, p.hb, 12, c.shade);
  limb([p.hip[0] - 5, p.hip[1]], p.fb, 15, c.shade);
  // 胴
  limb(p.hip, p.sh, 36, c.gi);
  ctx.save(); ctx.strokeStyle = c.belt; ctx.lineWidth = 9; ctx.lineCap = 'butt';
  const bx = p.hip[0] + (p.sh[0] - p.hip[0]) * 0.12, by = p.hip[1] + (p.sh[1] - p.hip[1]) * 0.12;
  ctx.beginPath(); ctx.moveTo(bx - 18, by); ctx.lineTo(bx + 18, by); ctx.stroke(); ctx.restore();
  limb([p.sh[0] - 6, p.sh[1] + 6], [p.sh[0] + 6, p.sh[1] + 30], 5, c.shade); // 襟
  // 頭
  ctx.fillStyle = c.skin; ctx.beginPath(); ctx.arc(p.head[0], p.head[1], 14, 0, 7); ctx.fill();
  ctx.fillStyle = c.hair; ctx.beginPath(); ctx.arc(p.head[0], p.head[1], 14.5, Math.PI * 0.95, Math.PI * 2.1); ctx.fill();
  ctx.fillRect(p.head[0] - 14, p.head[1] - 4, 7, 8);
  if (c.band) { ctx.fillStyle = c.band; ctx.fillRect(p.head[0] - 14, p.head[1] - 9, 29, 4); }
  ctx.fillStyle = '#111'; ctx.fillRect(p.head[0] + 5, p.head[1] - 2, 3, f.state === 'hit' ? 1 : 4);
  // 手前の脚・腕
  limb([p.hip[0] + 5, p.hip[1]], p.ff, 16, c.gi);
  ctx.fillStyle = c.skin;
  ctx.beginPath(); ctx.arc(p.ff[0] + 3, p.ff[1], 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(p.fb[0] + 3, p.fb[1], 7, 0, 7); ctx.fill();
  limb(p.sh, p.hf, 13, c.gi);
  ctx.beginPath(); ctx.arc(p.hf[0], p.hf[1], 7, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(p.hb[0], p.hb[1], 6, 0, 7); ctx.fill();
  ctx.restore();
}
function drawFx() {
  for (const e of fx) {
    const y = e.ground ? GROUND + e.y : GROUND + e.y;
    const k = e.t / 18;
    ctx.save(); ctx.translate(e.x, y);
    ctx.globalAlpha = 1 - k;
    if (e.kind === 'block') {
      ctx.strokeStyle = '#9ad'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 8 + k * 22, 0, 7); ctx.stroke();
    } else {
      const R = (e.kind === 'big' ? 46 : 28) * (0.5 + k);
      ctx.fillStyle = e.kind === 'big' ? '#ffd23a' : '#fff';
      ctx.beginPath();
      for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = i % 2 ? R * 0.45 : R; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#e0422a'; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.restore();
  }
  for (const q of projs) {
    ctx.save(); ctx.translate(q.x, GROUND + q.y);
    const g = ctx.createRadialGradient(0, 0, 3, 0, 0, 26);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#7fd6ff'); g.addColorStop(1, 'rgba(60,140,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 26, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(160,220,255,.5)';
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.arc(-Math.sign(q.vx) * i * 14, 0, 14 - i * 3, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}
function bar(x, w, hp, rtl, name, wins) {
  ctx.fillStyle = '#000'; ctx.fillRect(x - 3, 21, w + 6, 30);
  ctx.fillStyle = '#5a1a1a'; ctx.fillRect(x, 24, w, 24);
  const cw = w * hp / 100;
  const g = ctx.createLinearGradient(0, 24, 0, 48);
  g.addColorStop(0, hp > 30 ? '#ffe94a' : '#ff7a4a'); g.addColorStop(1, hp > 30 ? '#e08a10' : '#c0301a');
  ctx.fillStyle = g; ctx.fillRect(rtl ? x + w - cw : x, 24, cw, 24);
  ctx.fillStyle = '#fff'; ctx.font = `bold 20px ${FONT}`; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = rtl ? 'right' : 'left'; ctx.fillText(name, rtl ? x + w : x, 78);
  for (let i = 0; i < 2; i++) {
    const cx = rtl ? x + w - (name.length * 20 + 24 + i * 22) : x + name.length * 20 + 24 + i * 22;
    ctx.fillStyle = i < wins ? '#ffd23a' : 'rgba(255,255,255,.2)';
    ctx.beginPath(); ctx.arc(cx, 71, 8, 0, 7); ctx.fill();
  }
}
function drawHUD() {
  const [p1, p2] = players;
  bar(30, 380, p1.hp, false, '1P ' + p1.ch.name, p1.wins);
  bar(W - 410, 380, p2.hp, true, (mode === 'cpu' ? 'CPU ' : '2P ') + p2.ch.name, p2.wins);
  ctx.fillStyle = '#000'; ctx.fillRect(W / 2 - 32, 18, 64, 48);
  ctx.fillStyle = timeLeft <= 10 ? '#ff6a4a' : '#fff'; ctx.font = `bold 38px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(Math.max(0, timeLeft)).padStart(2, '0'), W / 2, 44);
}
function bigText(t, y, size, col) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${size}px ${FONT}`;
  ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round'; ctx.strokeText(t, W / 2, y);
  ctx.fillStyle = col; ctx.fillText(t, W / 2, y);
}
function drawTitle() {
  drawBG();
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  bigText('柔道ファイター', 130, 84, '#fff');
  ctx.fillStyle = '#ffd23a'; ctx.font = `bold 22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('投げて、打って、一本を取れ！', W / 2, 200);
  MENU().forEach((it, i) => {
    const y = 270 + i * 70, sel = i === menuSel;
    ctx.fillStyle = sel ? '#c0392b' : 'rgba(255,255,255,.12)'; ctx.fillRect(280, y, 400, 56);
    ctx.strokeStyle = sel ? '#ffd23a' : '#888'; ctx.lineWidth = 3; ctx.strokeRect(280, y, 400, 56);
    ctx.fillStyle = '#fff'; ctx.font = `bold 24px ${FONT}`; ctx.fillText(it.text, W / 2, y + 29);
  });
  ctx.fillStyle = '#ccc'; ctx.font = `16px ${FONT}`;
  ctx.fillText('↑↓で選んで Enter / タップで決定', W / 2, 500);
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  if (scene === 'title') { drawTitle(); ctx.restore(); return; }
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBG();
  // 手前にいる方を後に描く（立っている方を上に）
  [...players].sort((a, b) => (a.state === 'down') - (b.state === 'down') || (a.state === 'attack') - (b.state === 'attack')).forEach(drawFighter);
  drawFx();
  ctx.restore();
  drawHUD();
  if (banner) {
    if (scene === 'intro') bigText(banner, 250, banner === 'FIGHT!' ? 110 : 90, banner === 'FIGHT!' ? '#ff5a3a' : '#fff');
    else if (scene === 'roundEnd') { bigText(banner, 230, 110, '#ffd23a'); if (phaseT > 50) bigText(winnerMsg, 330, 48, '#fff'); }
    else if (scene === 'matchEnd') {
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
      bigText(banner, 220, 96, '#ffd23a');
      bigText('Enter / タップでもう一度　（T: タイトル）', 340, 28, '#fff');
    }
  }
  if (paused) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); bigText('PAUSE', H / 2, 90, '#fff'); }
}

/* ---------- ループ（60fps固定） ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { if (!paused) update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// テスト用に公開
window.__game = { players, get scene() { return scene; }, startMatch, set mode(v) { mode = v; }, update, draw };
</script>
