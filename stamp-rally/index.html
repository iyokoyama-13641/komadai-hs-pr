<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校内クイズ探検</title>
<style>
  :root {
    --bg: #f6f3ea; --card: #fff; --ink: #222; --sub: #6b6b6b;
    --main: #1f5a45; --accent: #e0a526; --line: #e3ded0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14211c; --card: #1d2f28; --ink: #f1efe6; --sub: #a9b5ae; --line: #2f4a40; --main: #4fae8a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 4px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 16px; }
  .progress { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .spot { background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 14px 10px;
    text-align: center; cursor: pointer; font: inherit; color: inherit; }
  .spot .emoji { font-size: 2rem; display: block; }
  .spot .name { font-weight: 700; margin-top: 4px; display: block; }
  .spot .hint { font-size: .75rem; color: var(--sub); display: block; margin-top: 2px; }
  .spot.done { border: 2px solid var(--main); }
  .spot.done .emoji { animation: pop .4s; }
  .spot.done::after { content: "✔ 正解！"; display: block; color: var(--main); font-weight: 700; margin-top: 6px; font-size: .85rem; }
  @keyframes pop { 0% { transform: scale(.3) rotate(-30deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  dialog { border: none; border-radius: 16px; padding: 20px; width: min(90vw, 380px); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  input { width: 100%; font: inherit; font-size: 1.2rem; padding: 10px; margin: 10px 0; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink); text-align: center; }
  .btns { display: flex; gap: 8px; }
  button.btn { flex: 1; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; }
  button.btn.primary { background: var(--main); color: #fff; border-color: var(--main); }
  .err { color: #c0392b; font-size: .85rem; min-height: 1.2em; margin: 0; }
  .clear { display: none; background: var(--accent); color: #222; border-radius: 14px; padding: 18px; text-align: center; margin-bottom: 16px; }
  .clear.show { display: block; animation: pop .5s; }
  .clear strong { font-size: 1.2rem; }
  .reset { margin-top: 24px; text-align: center; }
  .reset button { background: none; border: none; color: var(--sub); text-decoration: underline; font: inherit; font-size: .8rem; }
  .msg { margin: 12px 0 8px; }
  .talk { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--accent); font-size: .9rem; }
  .talk b { display: block; font-size: .75rem; color: var(--sub); margin-bottom: 2px; }
  .rank { margin-top: 10px; font-weight: 700; color: var(--main); }
  .cert { background: var(--card); color: var(--ink); border: 3px double var(--accent); border-radius: 12px; padding: 14px 10px; margin: 12px 0 8px; }
  .cert-s { font-size: .75rem; color: var(--sub); }
  .cert-t { font-size: 1.3rem; font-weight: 800; margin: 2px 0 6px; }
  .cert input { font-size: 1.1rem; margin: 4px 0; }
  .cert-d { font-size: .85rem; color: var(--sub); }
  .clear .note { font-size: .8rem; margin: 6px 0 0; }
  .confetti { position: fixed; top: -2rem; font-size: 1.6rem; pointer-events: none; animation: fall 2.2s ease-in forwards; z-index: 10; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .8; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
  .q { font-weight: 700; margin: 10px 0 6px; }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .choice { font: inherit; color: inherit; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 10px 6px; cursor: pointer; text-align: center; }
  .choice .ce { font-size: 2.2rem; display: block; line-height: 1.2; }
  .choice .ct { font-size: .8rem; color: var(--sub); }
  .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .choice.wrong { opacity: .4; border-style: dashed; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>🏫 校内クイズ探検</h1>
  <p class="lead" style="margin-bottom:2px">令和8年度 学校説明会｜駒澤大学高等学校</p>
  <p class="lead">保護者の方といっしょに、校内に貼ってある番号①〜⑫の場所を回りながらクイズに挑戦！<br>絵を4つの中から選ぼう。その場所で実際に見ながら答えると、もっと楽しいよ。<br>靴カバーを着けて見学してください。</p>

  <div class="clear" id="clear">
    <strong>🎉 コンプリート！</strong>
    <div class="cert">
      <div class="cert-s">駒澤大学高等学校 学校説明会</div>
      <div class="cert-t">校内探検 認定証</div>
      <input id="nick" placeholder="ニックネームを入力" maxlength="12" autocomplete="off">
      <div class="cert-d" id="certDate"></div>
    </div>
    <p class="note">スクリーンショットで保存して、おうちで見返してね。</p>
  </div>

  <section class="progress">
    <div><strong id="count">0</strong> / <span id="total"></span> 問正解で完成（全<span id="all"></span>問）</div>
    <div class="bar"><div id="fill"></div></div>
    <div class="rank" id="rank"></div>
  </section>

  <section class="grid" id="grid"></section>

  <div class="reset"><button id="reset">最初からやり直す</button></div>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <div style="font-size:2rem" id="dEmoji"></div>
    <strong id="dName"></strong>
    <p class="lead" id="dHint" style="margin:4px 0 0"></p>
    <p class="msg" id="dMsg" hidden></p>
    <p class="talk" id="dTalk" hidden><b>👨‍👩‍👧 親子トーク</b><span id="dTalkText"></span></p>
    <div id="askBox">
      <p class="q" id="dQ"></p>
      <div class="choices" id="choices"></div>
      <p class="err" id="err"></p>
    </div>
    <div class="btns">
      <button type="button" class="btn" id="cancel">閉じる</button>
      <button type="submit" class="btn primary" id="submitBtn">スタンプをもらう</button>
    </div>
  </form>
</dialog>

<script>
// ★ スポットの編集はここだけ。q=問題、choices=絵の4択（先頭が正解）、msg=特徴メッセージ、talk=親子トーク。
const SPOTS = [
  { id: "s1", emoji: "🏋️", name: "① トレーニングルーム", hint: "A地区 1階｜ジムみたいな部屋",
    q: "胸の筋肉（大胸筋）を鍛えるのは、どれ？",
    choices: [{"e": "🏋️", "t": "ベンチプレス"}, {"e": "🦵", "t": "スクワット"}, {"e": "🦿", "t": "レッグプレス"}, {"e": "💪", "t": "アームカール"}], // 先頭が正解（表示時にシャッフル）
    msg: "ベンチプレスは胸、スクワットとレッグプレスは脚、アームカールは腕の筋肉を鍛えます。ジムみたいなウエイトトレーニングマシーンがずらり。部活動や授業で使います。",
    talk: "どのマシンを使ってみたい？ 親子で見つけてみよう。" },
  { id: "s2", emoji: "🍰", name: "② 調理実習室", hint: "A地区 1階｜男女いっしょに実習",
    q: "じゃがいもやにんじんの皮をむくのに便利な道具は、どれ？",
    choices: [{"e": "🥕", "t": "ピーラー"}, {"e": "🥄", "t": "おたま"}, {"e": "🍳", "t": "泡立て器"}, {"e": "🥢", "t": "菜箸"}], // 先頭が正解（表示時にシャッフル）
    msg: "ピーラーは野菜の皮を薄くむける道具です。カレーライスからケーキまで作る実習室で、男子も女子も一緒に作ります！ 部屋の前に、大学の資料・昨年度の入試問題・部活動案内があるので、ご自由にどうぞ。",
    talk: "ここで作ってみたい料理は何？" },
  { id: "s3", emoji: "🖌️", name: "③ 書道室", hint: "A地区 1階",
    q: "「〇〇も筆の誤り」ということわざの〇〇に入る、書の名人は誰？",
    choices: [{"e": "🖌️", "t": "弘法（空海）"}, {"e": "📜", "t": "最澄"}, {"e": "👑", "t": "聖徳太子"}, {"e": "⚔️", "t": "織田信長"}], // 先頭が正解（表示時にシャッフル）
    msg: "弘法大師（空海）は、書の名人としても有名です。書の名人でも、たまには書き間違えることがある。「名人でも失敗する」という意味のことわざです。この教室は、説明会の日は個別相談会場になっています。",
    talk: "家族の中で、いちばん字がきれいなのは誰？" },
  { id: "s4", emoji: "💻", name: "④ 情報処理実習室", hint: "A地区 1階｜2か所あるよ",
    q: "パソコンの「頭脳」にあたり、計算や命令の処理をする部品は、どれ？",
    choices: [{"e": "🧠", "t": "CPU"}, {"e": "⌨️", "t": "キーボード"}, {"e": "🖱️", "t": "マウス"}, {"e": "🖥️", "t": "ディスプレイ"}], // 先頭が正解（表示時にシャッフル）
    msg: "CPU（シーピーユー）は、計算や命令の処理をするパソコンの頭脳です。難しいことも、やさしく、深く、楽しく学べる情報処理実習室。パソコンの部屋は全部で2か所あります。",
    talk: "パソコンで作ってみたいものはある？" },
  { id: "s5", emoji: "🎵", name: "⑤ 音楽室", hint: "A地区 1階",
    q: "「運命」や「第九」を作曲した音楽家は、誰？",
    choices: [{"e": "🎼", "t": "ベートーヴェン"}, {"e": "🎹", "t": "モーツァルト"}, {"e": "🎻", "t": "バッハ"}, {"e": "🎶", "t": "ショパン"}], // 先頭が正解（表示時にシャッフル）
    msg: "「運命」「第九」はベートーヴェンの名曲です。耳が聞こえにくくなっても作曲を続けたことで知られています。ここは音楽の授業で使う特別教室です。",
    talk: "家族それぞれの「最近よく聴く曲」を教え合ってみよう。" },
  { id: "s6", emoji: "🎨", name: "⑥ 美術室", hint: "A地区 1階",
    q: "絵の具の黄色と青を混ぜると、何色になる？",
    choices: [{"e": "🟡🔵", "t": "緑"}, {"e": "🔴🔵", "t": "むらさき"}, {"e": "🔴🟡", "t": "オレンジ"}, {"e": "🔴⚪", "t": "ピンク"}], // 先頭が正解（表示時にシャッフル）
    msg: "黄色と青を混ぜると緑になります。ほかにも、赤と青でむらさき、赤と黄でオレンジ。色を混ぜるのは、美術の授業でも大活躍です。ここは美術の授業で使う特別教室です。",
    talk: "小学校の図工で、いちばん好きだった作品は？" },
  { id: "s7", emoji: "🥋", name: "⑦ 修道館", hint: "C地区 地下｜道場",
    q: "剣道の試合で使う、竹でできた刀の名前は、どれ？",
    choices: [{"e": "🎋", "t": "竹刀（しない）"}, {"e": "🪵", "t": "木刀"}, {"e": "☂️", "t": "かさ"}, {"e": "🏏", "t": "バット"}], // 先頭が正解（表示時にシャッフル）
    msg: "竹刀（しない）は、剣道で使う竹でできた道具です。ここは伝統と趣のある道場。男子は体育の授業で柔道・剣道をやります。",
    talk: "柔道と剣道、やってみたいのはどっち？" },
  { id: "s8a", emoji: "🔭", name: "⑧ 物理・地学実験室", hint: "B地区 3階",
    q: "太陽系の惑星で、いちばん大きいのは、どれ？",
    choices: [{"e": "🟠", "t": "木星"}, {"e": "🪐", "t": "土星"}, {"e": "🔴", "t": "火星"}, {"e": "🌍", "t": "地球"}], // 先頭が正解（表示時にシャッフル）
    msg: "いちばん大きい惑星は木星です。地球が約1300個も入る大きさだといわれています。ここは物理・地学の実験をする実験室（3階）です。",
    talk: "理科でいちばんおもしろかった実験は？" },
  { id: "s8b", emoji: "🧪", name: "⑧ 生物・化学実験室", hint: "B地区 4階",
    q: "血液の成分で、体じゅうに酸素を運んでいるのは、どれ？",
    choices: [{"e": "🩸", "t": "赤血球"}, {"e": "🛡️", "t": "白血球"}, {"e": "🩹", "t": "血小板"}, {"e": "💧", "t": "血しょう"}], // 先頭が正解（表示時にシャッフル）
    msg: "酸素を運ぶのは赤血球です。赤い色は、酸素と結びつく「ヘモグロビン」のはたらきです。ここは生物・化学の実験をする実験室（4階）です。",
    talk: "調べてみたい生き物や、不思議に思うことはある？" },
  { id: "s9", emoji: "🧘", name: "⑨ 坐禅堂", hint: "B地区 屋上",
    q: "坐禅堂にお祀りしている仏様は、どなた？",
    choices: [{"e": "🙏", "t": "文殊菩薩"}, {"e": "🙏", "t": "観音菩薩"}, {"e": "🙏", "t": "地蔵菩薩"}, {"e": "🙏", "t": "普賢菩薩"}], // 先頭が正解（表示時にシャッフル）
    msg: "坐禅堂には、文殊菩薩（もんじゅぼさつ）様をお祀りしています。「三人寄れば文殊の知恵」の文殊です。本格的に坐禅ができる施設で、校舎の屋上にあります。",
    talk: "ここで1分だけ、静かに深呼吸してみよう。" },
  { id: "s10", emoji: "🥐", name: "⑩ 地下ホール・購買部", hint: "D地区 地下",
    q: "パンをふくらませるのに使われる、小さな生き物は、どれ？",
    choices: [{"e": "🍞", "t": "酵母（イースト）"}, {"e": "🥛", "t": "乳酸菌"}, {"e": "🫘", "t": "納豆菌"}, {"e": "🦠", "t": "大腸菌"}], // 先頭が正解（表示時にシャッフル）
    msg: "パンがふくらむのは、酵母（イースト）が出す二酸化炭素のおかげです。ここはパンやおにぎりなどを売っている購買部がある、地下ホールです。",
    talk: "お昼に買ってみたいのは何？" },
  { id: "s11", emoji: "🎬", name: "⑪ 第一AV教室", hint: "D地区 2階",
    q: "大きなスクリーンに映像を映す機械は、どれ？",
    choices: [{"e": "📽️", "t": "プロジェクター"}, {"e": "📎", "t": "ホッチキス"}, {"e": "🗑️", "t": "シュレッダー"}, {"e": "🧮", "t": "電卓"}], // 先頭が正解（表示時にシャッフル）
    msg: "プロジェクターは、映像をスクリーンに大きく映します。ここはビデオなどを大画面で見られる教室です。",
    talk: "大画面で見てみたい映画や動画は？" },
  { id: "s12", emoji: "📚", name: "⑫ 図書室", hint: "D地区 3階",
    q: "「吾輩は猫である」を書いた作家は、誰？",
    choices: [{"e": "📚", "t": "夏目漱石"}, {"e": "🚃", "t": "芥川龍之介"}, {"e": "🍎", "t": "太宰治"}, {"e": "🌌", "t": "宮沢賢治"}], // 先頭が正解（表示時にシャッフル）
    msg: "「吾輩は猫である」は夏目漱石のデビュー作です。ここは蔵書が約4万冊の図書室（3階）。気になる本を探してみよう。",
    talk: "最近読んだ本で、いちばんおもしろかったのは？" },
];
// 何個集めたらコンプリートにするか（全部なら SPOTS.length）
const GOAL = 8;
const RANKS = [[0, "これから出発！"], [1, "🥾 見習い探検隊"], [3, "🧭 探検隊員"], [5, "🔦 ベテラン隊員"], [GOAL, "🏅 校内マスター"], [SPOTS.length, "👑 全スポット制覇！"]];
const rankOf = n => RANKS.filter(r => n >= r[0]).pop()[1];
const KEY = "stamp-rally-v1", NKEY = "stamp-rally-nick";
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function burst() {
  for (let i = 0; i < 28; i++) {
    const c = document.createElement("span");
    c.className = "confetti"; c.textContent = ["🎉", "⭐", "🎊", "✨"][i % 4];
    c.style.left = Math.random() * 95 + "vw"; c.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 3200);
  }
}
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
let done = load();
let current = null;

const $ = id => document.getElementById(id);
$("total").textContent = GOAL; $("all").textContent = SPOTS.length;

function render() {
  $("grid").innerHTML = "";
  SPOTS.forEach(s => {
    const b = document.createElement("button");
    const got = done.includes(s.id);
    b.className = "spot" + (got ? " done" : "");
    b.innerHTML = `<span class="emoji">${got ? s.emoji : "❓"}</span><span class="name">${s.name}</span><span class="hint">${s.hint}</span>`;
    b.onclick = () => open(s);
    $("grid").appendChild(b);
  });
  $("count").textContent = Math.min(done.length, GOAL);
  $("fill").style.width = (Math.min(done.length / GOAL, 1) * 100) + "%";
  $("clear").classList.toggle("show", done.length >= GOAL);
  $("rank").textContent = "称号：" + rankOf(done.length);
}

function setMode(reveal) {
  $("askBox").hidden = reveal; $("dMsg").hidden = !reveal;
  $("submitBtn").hidden = !reveal; $("submitBtn").textContent = "OK";
  $("cancel").hidden = reveal;
  $("dMsg").textContent = reveal ? current.msg : "";
  $("dTalk").hidden = !reveal; $("dTalkText").textContent = reveal ? current.talk : "";
}
function buildChoices(s) {
  $("dQ").textContent = s.q;
  const list = s.choices.map((c, i) => ({ ...c, ok: i === 0 })).sort(() => Math.random() - .5);
  $("choices").innerHTML = "";
  list.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice";
    b.innerHTML = `<span class="ce">${c.e}</span><span class="ct">${c.t}</span>`;
    b.onclick = () => {
      if (c.ok) { done.push(s.id); save(done); render(); setMode(true); if (done.length === GOAL) burst(); }
      else { b.classList.add("wrong", "shake"); $("err").textContent = "ざんねん！ もういちど考えてみよう。"; }
    };
    $("choices").appendChild(b);
  });
}
function open(s) {
  current = s;
  $("dEmoji").textContent = s.emoji; $("dName").textContent = s.name; $("dHint").textContent = s.hint;
  $("err").textContent = "";
  const got = done.includes(s.id);
  setMode(got);
  if (!got) buildChoices(s);
  $("dlg").showModal();
}

$("form").addEventListener("submit", e => { e.preventDefault(); $("dlg").close(); });
$("cancel").onclick = () => $("dlg").close();
$("reset").onclick = () => { if (confirm("これまでの正解の記録をすべて消します。よろしいですか？")) { done = []; save(done); render(); } };

$("certDate").textContent = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "long", day: "numeric" }) + " 認定";
$("nick").value = lsGet(NKEY);
$("nick").addEventListener("input", () => lsSet(NKEY, $("nick").value));
render();
</script>
</body>
</html>
